<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ebd2"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Flora – zgadnij roślinę</title>
<style>
:root{box-sizing:border-box;--bg:#e9ebd2;--panel:#eef0d8;--paper:#fbfaf0;--ink:#20201c;--mut:#6d6a58;--line:#20201c;--hair:#c9c6a8;--acc:#3d2208;--ok:#1e6b34;--no:#b03a2a}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,'Times New Roman',serif}
main{max-width:680px;margin:auto;padding:14px}
.topline{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;border-bottom:3px solid var(--line);padding:10px 2px 8px}
h1{font:700 24px Georgia,serif;margin:0;letter-spacing:.3px}
h1 small{font:italic 400 14px Georgia,serif;color:var(--mut);margin-left:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:13px/1.2 Verdana,sans-serif;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button.p{background:var(--acc);color:#f7f3e2;border-color:var(--acc)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:10px 0}
#info{padding:0;overflow:hidden}
input{width:100%;box-sizing:border-box;font:15px Georgia,serif;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.sug{border:1px solid var(--line);border-radius:6px;background:var(--paper);margin-top:4px;max-height:260px;overflow:auto}
.sug div{padding:8px 10px;border-bottom:1px solid var(--hair);cursor:pointer;font-family:Verdana,sans-serif;font-size:13px}
.sug small,.mut{color:var(--mut)}
.tag{font:11px Verdana,sans-serif;border:1px solid var(--hair);border-radius:99px;padding:1px 7px;margin-left:6px;color:var(--mut)}
.treescroll{overflow-x:auto;background:var(--panel)}
.treemeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:12px Verdana,sans-serif;color:var(--mut);padding:8px 12px;border-top:1px solid var(--hair)}
.treemeta b{color:var(--ink)}
#log{font-size:13.5px}
.att{font-size:13px;border-bottom:1px solid var(--hair);padding:7px 2px}
.att b{font-weight:700}
.att .ok{color:var(--ok);font-weight:700}
.att .bad{color:var(--no);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-family:Verdana,sans-serif;font-size:12px}
.stats b{display:block;font-size:22px;font-family:Georgia,serif}
.bar{height:6px;background:var(--hair);border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ok)}
svg text{user-select:none}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font:11.5px Verdana,sans-serif;color:var(--mut);padding:7px 12px;border-top:1px solid var(--hair)}
.legend i{display:inline-block;width:14px;height:10px;border:1px solid var(--line);border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .t{background:linear-gradient(90deg,#d97706,#5fb04a,#177a8c);border-color:#0c130f}.legend .x{background:#3b1f22;border-color:#d4675b}.legend .d{background:#1f2f25;border-color:#5f8070;border-style:dashed}
.treescroll{background:#111b15;border-bottom:1px solid #0c130f}
.hint{padding:9px 12px;border-top:1px solid var(--hair);background:#fff3c4;font:13px/1.45 Verdana,sans-serif;color:#4a3b05}
#hb:disabled{opacity:.45;cursor:default}
html,body{overscroll-behavior:none}button{touch-action:manipulation}
#dlg{position:fixed;inset:0;background:rgba(20,20,10,.5);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}.dl{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:340px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}.dl p{margin:0 0 14px;font-size:14.5px;line-height:1.5}.dl .row{justify-content:flex-end}
.tabs{margin-top:10px}.tabs button{flex:1}
.cr{padding:6px 10px;border-bottom:1px solid var(--hair);font-size:13.5px}.cr.u{color:#9a9884;background:#e3e4cf;letter-spacing:4px}.cr.f{background:#e1efdc;border-left:4px solid var(--ok)}.cr small{display:block;color:var(--mut);font:11.5px/1.4 Verdana,sans-serif}
details.og{margin:6px 0;border:1px solid var(--line);border-radius:4px;background:var(--paper)}details.og summary{cursor:pointer;padding:8px 10px;font:13px Verdana,sans-serif;display:flex;justify-content:space-between;gap:8px}
textarea{width:100%;box-sizing:border-box;height:90px;font:11px monospace;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
</style></head><body><main>
<div class="topline"><h1>Flora<small id="sub">zgadnij roślinę · drzewo wyboru</small></h1><div class="row"><button id="lg" title="Language / Język">🌐 EN</button></div></div>
<div class="row tabs"><button id="bg" class="p">Gra</button><button id="bs">Statystyki</button><button id="bc">Kolekcja</button></div>
<div id="v-g"><div class="row" style="margin-top:8px"><button id="md" class="p">Dzienna</button><button id="mt">Trening</button><button id="gu">Poddaj się</button><button id="hb">💡 Dwie drogi</button><span class="mut" id="cnt" style="margin-left:auto"></span></div>
<div class="card" id="info"></div>
<input id="q" placeholder="Gatunek, nazwa polska, rodzina, klad lub rodzaj…" autocomplete="off">
<div id="sug" class="sug" hidden></div>
<div id="log"></div></div>
<div id="v-s" hidden><div id="st" class="card"></div></div>
<div id="v-c" hidden></div>
</main>

["g","s","c"].forEach(k=>{$("#v-"+k).hidden=k!=n;$("#b"+k).className=k==n?"p":""});

function dayIdx(){let h=2166136261;for(const c of today()){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}h^=h>>>15;h=Math.imul(h,2246822507);h^=h>>>13;h=Math.imul(h,3266489909);h^=h>>>16;return(h>>>0)%S.length}
/* Szn = szansa na nowy gatunek; no = odkryte, ng = wszystkie gatunki
   <10% odkrytych: czysta losowość | 10-50%: no/ng + no/(ng*3) | od 50%: no/ng - no/(ng*5) */
function pickTrain(){const f=stats().found,ng=S.length,D=S.filter(s=>f[s.n]),U=S.filter(s=>!f[s.n]),no=D.length,r=no/ng;
if(r<.1)return S[Math.random()*ng|0];
let p=r>=.5?no/ng-no/(ng*5):no/ng+no/(ng*3);p=Math.min(1,Math.max(0,p));
const A=!U.length||Math.random()>=p?D:U;return A[Math.random()*A.length|0]}
function chartHTML(){const H=loadH(),N=HR,W=320,B=104,bw=W/N,Dd=[];for(let i=N-1;i>=0;i--){const k=ago(i);Dd.push([k,H[k]||{w:0,l:0,d:0}])}
const mx=Math.max(4,...Dd.map(([,e])=>e.w+e.l)),tot=Dd.reduce((a,[,e])=>a+e.w+e.l,0);
let s=`<svg viewBox="0 0 ${W} ${B+26}" width="100%" style="display:block;margin-top:6px"><text x="0" y="9" font-size="9" fill="#6d6a58">${mx}</text><line x1="0" y1="${B}" x2="${W}" y2="${B}" stroke="#20201c"/>`;
Dd.forEach(([k,e],i)=>{const x=i*bw+bw*.15,w=bw*.7,a=e.w/mx*(B-12),b=e.l/mx*(B-12),c=x+w/2;
s+=`<g><title>${k}: ${e.w} / ${e.l}</title><rect x="${x}" y="${B-a}" width="${w}" height="${a}" fill="#1e6b34"/><rect x="${x}" y="${B-a-b}" width="${w}" height="${b}" fill="#b03a2a"/>`;
if(N<=14||(N-1-i)%5==0)s+=`<text x="${c}" y="${B+11}" text-anchor="middle" font-size="8" fill="#6d6a58">${+k.slice(8)}</text>`;
if(e.d)s+=`<circle cx="${c}" cy="${B+19}" r="2.5" fill="#3d2208"/>`;s+=`</g>`});
return`<div style="margin-top:14px"><div class="row" style="justify-content:space-between"><b>${Y("cht")}</b><span class="row">${[14,30].map(n=>`<button data-h="${n}"${HR==n?' class="p"':""}>${Y("h"+n)}</button>`).join("")}</span></div>${s}</svg><div class="legend" style="border:0;padding:4px 0"><span><i style="background:#1e6b34"></i>${Y("lw")}</span><span><i style="background:#b03a2a"></i>${Y("ll")}</span><span>● ${Y("ld")}</span><span>Σ ${tot}</span></div></div>`}
function dataHTML(){return`<h4 style="margin:14px 0 6px">${Y("data")}</h4><div class="row"><button id="ex">${Y("exp")}</button><button id="im">${Y("imp")}</button></div><div id="dp" hidden style="margin-top:8px"></div><p class="mut" id="vr" style="font-size:11px;text-align:center;margin-top:22px;user-select:none">${Y("ver")}</p><div id="rz" hidden><div style="border:1px solid var(--no);border-radius:6px;padding:8px"><div style="font-size:13px;margin-bottom:6px">${Y("wtype")}</div><input id="wi" autocomplete="off"><button id="wd" disabled style="margin-top:6px">${Y("wgo")}</button></div></div>`}
function wireStats(){let c=0;$("#vr").onclick=()=>{if(++c>=7)$("#rz").hidden=false};
$("#wi").oninput=e=>{$("#wd").disabled=e.target.value.trim().toUpperCase()!=Y("wword")};
$("#wd").onclick=()=>{save({});try{localStorage.removeItem("flora_h")}catch(e){}showStats()};
$("#ex").onclick=()=>dp(1);$("#im").onclick=()=>dp(0);
$("#st").querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{HR=+b.dataset.h;showStats()})}
const pack=()=>"FLORA1:"+btoa(unescape(encodeURIComponent(JSON.stringify({s:load(),h:loadH()}))));
async function unpack(t){let o;
try{o=JSON.parse(decodeURIComponent(escape(atob(t.trim().replace(/^FLORA1:/,"")))));if(!o||typeof o.s!="object"||!o.s||typeof o.h!="object"||(o.s.found&&typeof o.s.found!="object"))throw 0}catch(e){await dlg(Y("bad"));return}
if(!await dlg(Y("cfImp"),{cancel:Y("no")}))return;save(o.s);saveH(o.h);await dlg(Y("okImp"));showStats()}
function dp(ex){const d=$("#dp");d.hidden=false;
d.innerHTML=`<textarea id="dt" ${ex?"readonly":`placeholder="${Y("pasteH")}"`}></textarea><div class="row" style="margin-top:6px">`+(ex?`<button id="b1">${Y("cpy")}</button>${canShare()?`<button id="b2">${Y("shr")}</button>`:""}<button id="b3">${Y("sv")}</button>`:`<button id="b1" class="p">${Y("load")}</button><input type="file" id="fi" accept=".txt,text/plain" style="width:auto">`)+`</div>`;
const t=$("#dt");
if(ex){t.value=pack();t.onfocus=()=>t.select();
$("#b1").onclick=async()=>{let ok=0;try{await navigator.clipboard.writeText(t.value);ok=1}catch(e){t.select();try{ok=document.execCommand("copy")}catch(_){}}if(ok)$("#b1").textContent=Y("cpd")};
if($("#b2"))$("#b2").onclick=async()=>{if(!await shareTxt(t.value))t.select()};
$("#b3").onclick=()=>saveTxt(t.value).catch(()=>t.select())}
else{$("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{t.value=r.result};r.readAsText(f)};
$("#b1").onclick=()=>unpack(t.value)}}
function crow(s,v){if(!v)return`<div class="cr u">???</div>`;
const p=s.lin.slice(0,L-1).filter(x=>x!="—").map(x=>nm(x)?cap(nm(x)):x).join(" › "),i=typeof v=="object"?[v.d,starTxt(v.s||2),v.t!=null?v.t+" "+Y("tr"):""].filter(Boolean).join(" · "):"";
return`<div class="cr f"><b><i>${esc(s.n)}</i></b>${nm(s.n)?" – "+esc(nm(s.n)):""}<small>${esc(p)}</small>${i?`<small>${esc(i)}</small>`:""}</div>`}
function showColl(){const f=stats().found,el=$("#v-c"),n=Object.keys(f).length,G={};
S.forEach(s=>{(G[s.lin[6]]=G[s.lin[6]]||[]).push(s)});
let h=`<div class="card"><b>${Y("coll")}</b>: ${n}/${S.length}<span class="bar" style="display:block"><i style="width:${n/S.length*100}%"></i></span><div class="row" style="margin-top:8px">${["a","f","u"].map(k=>`<button data-f="${k}"${CF==k?' class="p"':""}>${Y("f"+k)}</button>`).join("")}</div></div>`;
for(const o in G){const Ls=G[o].filter(s=>CF=="a"||(CF=="f")==!!f[s.n]);if(!Ls.length)continue;
h+=`<details class="og"${CF!="a"?" open":""}><summary><span>${esc(lab(o))}</span><span>${G[o].filter(s=>f[s.n]).length}/${G[o].length}</span></summary>${Ls.map(s=>crow(s,f[s.n])).join("")}</details>`}
el.innerHTML=h;el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{CF=b.dataset.f;showColl()})}

const CAP=window.Capacitor,P=(CAP&&CAP.Plugins)||{};
function dlg(msg,o){o=o||{};return new Promise(res=>{const d=document.createElement("div");d.id="dlg";d.innerHTML='<div class="dl"><p></p><div class="row"></div></div>';d.querySelector("p").textContent=msg;const row=d.querySelector(".row");
const mk=(t,v,c)=>{const b=document.createElement("button");b.textContent=t;if(c)b.className="p";b.onclick=()=>{d.remove();res(v)};row.append(b)};
if(o.cancel)mk(o.cancel,false);mk(o.ok||Y("ok"),true,1);document.body.append(d)})}
const canShare=()=>!!((P.Share&&P.Share.share)||navigator.share);
async function shareTxt(t){try{if(P.Share&&P.Share.share)await P.Share.share({title:"Flora",text:t,dialogTitle:"Flora"});else await navigator.share({title:"Flora",text:t});return 1}catch(e){return e&&e.name=="AbortError"?1:0}}
async function saveTxt(t){const nm="flora-"+today()+".txt";
if(P.Filesystem&&P.Filesystem.writeFile&&P.Share&&P.Share.share){const r=await P.Filesystem.writeFile({path:nm,data:t,directory:"CACHE",encoding:"utf8"});await P.Share.share({title:nm,url:r.uri,dialogTitle:"Flora"});return}
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download=nm;a.click()}
if(P.App&&P.App.addListener)P.App.addListener("backButton",()=>{const d=$("#dlg");if(d){d.querySelector("button").click();return}if(cur!="g"){tab("g");return}P.App.exitApp()});
if("serviceWorker"in navigator&&!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform())&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
applyLang();start("d");
